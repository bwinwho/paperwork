name: Build and release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release (e.g. 1.0.0). Only used when run manually."
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Manual runs don't start from a tag push, so create one here using the
      # workflow's own GitHub credentials.
      - name: Determine release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Paperwork $tag"
            git push origin "$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: budget
        run: flutter pub get

      # No signing keystore is committed to the repo yet, so the release build type has
      # no signing config to use. Generate a throwaway one so `flutter build apk --release`
      # produces an installable (self-signed, not Play Store-ready) APK. Replace this with a
      # persisted keystore + GitHub secrets before shipping to an app store.
      - name: Generate a temporary release keystore
        working-directory: budget/android
        run: |
          keytool -genkeypair -v -keystore app/release.keystore.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias paperwork \
            -storepass paperwork123 -keypass paperwork123 \
            -dname "CN=Paperwork, OU=Paperwork, O=Paperwork, L=Unknown, ST=Unknown, C=US"
          cat > key.properties <<EOF
          storePassword=paperwork123
          keyPassword=paperwork123
          keyAlias=paperwork
          storeFile=release.keystore.jks
          EOF

      - name: Build release APK
        working-directory: budget
        run: flutter build apk --release

      - name: Rename APK
        working-directory: budget
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/paperwork-${{ steps.vars.outputs.version }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
